name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (standalone, debug-signed)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Copy APK
        run: cp android/app/build/outputs/apk/release/app-release.apk linterna.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Linterna (Android)
          files: app-android/linterna.apk
          fail_on_unmatched_files: true
